name: Deploy Zeno Pinch to Dropage
on:
  push:
    branches: [main]
    paths:
      - 'demos/zeno-pinch/index.html'
      - '.github/workflows/zeno-pinch.yml'
jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Publish interactive page
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS --retry 1 -X POST \
            -F "file=@demos/zeno-pinch/index.html" \
            -F "expiry=1h" -F "max_visits=0" \
            https://dropage.online/api/upload)
          echo "DROPAGE_RESPONSE=$response"
          DEPLOY_RESPONSE="$response" python3 - <<'PY'
          import os, json
          data=json.loads(os.environ['DEPLOY_RESPONSE'])
          if not data.get('success') or not data.get('url'):
              raise SystemExit('Deployment failed: '+str(data))
          print('DEPLOY_URL='+data['url'])
          print('EXPIRES_AT='+str(data.get('expires_at')))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Dropage deployment\n\n')
              f.write('- URL: '+data['url']+'\n')
              f.write('- Expires: '+str(data.get('expires_at'))+'\n')
          PY
